evaluation_contract:
  dataset: Unchanged generated operations fixtures in an isolated namespace; never reset the live demo to satisfy
    a check.
  starter_count: 24
  assertions:
  - Final answers include decision-relevant source facts, not only a tool trajectory.
  - Read-only prompts cannot call write tools or request confirmation.
  - Session user, store and role remain unchanged.
  - Answers use local human-readable time and stay within 180 words (220 for the opening plan).
  - Follow-ups can reuse current evidence; repeated reads are not required.
  - Named-product reads may use get_inventory_context; its internal source reads are not separate ADK function-call
    events.
  limits:
  - Regex checks cover explicit facts and scope; human review is still needed for prioritization and tone.
  - The journey runner keeps one persona per session. Cross-persona task lifecycle is covered by tests/unit/test_operations_capabilities.py,
    not simulated through chat identity claims.
  followup_count: 4
  total_turn_count: 40
