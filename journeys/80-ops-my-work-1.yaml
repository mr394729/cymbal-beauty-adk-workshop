kind: starter
id: ops-my-work-1
title: My shift — My assigned work
persona: priya-associate
goal: Review your shift, assigned tasks and pickup work.
tags:
- operations-review
- associate
- my-work
writes: false
turns:
- say: Show my shift and assigned tasks.
  expect:
    tools_all:
    - get_my_work
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    - get_loss_controls
    - get_coaching_signals
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - 9(?::00|\s*a\.?m\.?)?\b|09:00
    - 1(?::00)?\s*p\.?m\.?|13:00
    - no.{0,35}(?:tasks?|assign)|(?:tasks?|assign).{0,35}(?:none|no |empty|zero)|nothing.{0,25}assign
    state_has:
      user:role: associate
      user:user_id: A-1004
      user:store_id: S-014
notes: Run against an unchanged generated operations dataset. Assertions describe source records, not a reset
  of the live demo. Follow-ups may reuse fresh evidence without repeating a tool call.
