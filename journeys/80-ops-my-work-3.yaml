kind: starter
id: ops-my-work-3
title: My shift — Today’s display work
persona: priya-associate
goal: Review your shift, assigned tasks and pickup work.
tags:
- operations-review
- associate
- my-work
writes: false
turns:
- say: What display work is due this morning?
  expect:
    tools_all:
    - get_merchandising_work
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    - get_loss_controls
    - get_coaching_signals
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - hydrat|skincare
    - 10(?::00|\s*a\.?m\.?)?\b
    - pickups?|BOPIS|allocat|stock
    state_has:
      user:role: associate
      user:user_id: A-1004
      user:store_id: S-014
notes: Run against an unchanged generated operations dataset. Assertions describe source records, not a reset
  of the live demo. Follow-ups may reuse fresh evidence without repeating a tool call.
