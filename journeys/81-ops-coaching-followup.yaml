id: ops-coaching-followup
title: Choose and review practical picking support
persona: dana-store-manager
goal: Use dated activity and completed learning to choose a focused intervention and a measurable follow-up.
tags:
- operations-review
- operations-followup
- manager
- development
writes: false
notes: Run against an unchanged generated operations dataset. Assertions describe source records, not a reset
  of the live demo. Follow-ups may reuse fresh evidence without repeating a tool call.
turns:
- say: BOPIS picking was slow yesterday. Anything in the coaching signals for Noor?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - (?:(?:\b(?:23|twenty.three)\b).{0,100}(?:picks?|lines?|completed)|(?:picks?|lines?|completed).{0,100}(?:\b(?:23|twenty.three)\b))
    - (?:(?:\b(?:12|twelve)\b).{0,100}(?:8|eight|target)|(?:8|eight|target).{0,100}(?:\b(?:12|twelve)\b))
    - (?:(?:\b(?:7|seven)\b).{0,100}(?:search|location)|(?:search|location).{0,100}(?:\b(?:7|seven)\b))
    - yesterday|October\s*2|Oct\.?\s*2|2\s*Oct
    state_has:
      user:role: store_manager
      user:user_id: U-M014
      user:store_id: S-014
- say: Has Noor already done BOPIS fundamentals, and what should we try instead of repeating it?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - fundamentals
    - complet|done|finish
    - location|backstock
    - 8.{0,15}min|eight.{0,15}min
    state_has:
      user:role: store_manager
      user:user_id: U-M014
      user:store_id: S-014
- say: What should I review on Noor’s next picking shift after that walkthrough?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - (?:(?:\b(?:5|five)\b).{0,100}(?:picks?|lines?)|(?:picks?|lines?).{0,100}(?:\b(?:5|five)\b))
    - search|location
    - interrupt
    - 8.{0,15}min|eight.{0,15}min|within.target|on.time
    - \A(?!.*\b(?:7|seven)\b).+\Z|\b(?:23|twenty.three|rate|rates|proportion|proportions|percentage|percent)\b
    state_has:
      user:role: store_manager
      user:user_id: U-M014
      user:store_id: S-014
  note: A five-pick follow-up must not compare its raw search-delay count against seven flags in a 23-pick
    baseline. If naming seven, preserve the denominator or explicitly compare rates/proportions.
- say: Do seven stock-search flags plus four interruptions mean eleven different delayed picks?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    - store_tasks
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - overlap|same pick|same line|not.{0,30}(?:distinct|different|separate)|cannot.{0,30}(?:add|sum)|can.t.{0,30}(?:add|sum)
    - 11|eleven|unique|distinct|different
    state_has:
      user:role: store_manager
      user:user_id: U-M014
      user:store_id: S-014
  note: An overlap question requests an explanation, not the assignment previously offered in a suggestion.
    Do not route into task creation or treat a suggested chip as a user instruction.
