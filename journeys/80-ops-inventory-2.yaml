kind: starter
id: ops-inventory-2
title: Shelf availability — Locate Hydra Cream
persona: dana-store-manager
goal: Recover shelf gaps and protect pickup commitments.
tags:
- operations-review
- manager
- inventory
writes: false
turns:
- say: Where should Priya pick the Lumière Hydra Cream, and how much should stay for pickups?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - B[- ]?2\b
    - (?:(?:\b(?:4|four)\b).{0,100}(?:pickups?|BOPIS|units?|orders?|hold|set aside|reserv|allocat)|(?:pickups?|BOPIS|units?|orders?|hold|set
      aside|reserv|allocat).{0,100}(?:\b(?:4|four)\b))
    - (?:(?:\b(?:3|three)\b).{0,100}(?:shel(?:f|ves)|display|replenish|remaining|left)|(?:shel(?:f|ves)|display|replenish|remaining|left).{0,100}(?:\b(?:3|three)\b))
    state_has:
      user:role: store_manager
      user:user_id: U-M014
      user:store_id: S-014
    tools_any:
    - get_inventory_context
    - get_stock_location
notes: Run against an unchanged generated operations dataset. Assertions describe source records, not a reset
  of the live demo. Follow-ups may reuse fresh evidence without repeating a tool call.
