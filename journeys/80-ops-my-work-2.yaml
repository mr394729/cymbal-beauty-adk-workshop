kind: starter
id: ops-my-work-2
title: My shift — Pickup priorities
persona: priya-associate
goal: Review your shift, assigned tasks and pickup work.
tags:
- operations-review
- associate
- my-work
writes: false
turns:
- say: Which Lumière Hydra Cream pickups need attention first?
  expect:
    no_tool_errors: true
    not_contains:
    - not an official procedure
    - the tool recommends
    max_latency_s: 75
    tools_none:
    - create_store_task
    - delegate_task
    - complete_my_task
    - report_my_task_blocker
    - get_loss_controls
    - get_coaching_signals
    confirmation: forbidden
    regex_all:
    - \A\s*\S+(?:\s+\S+){0,179}\s*\Z
    - \A(?!.*\b20\d{2}-\d{2}-\d{2}T\d{2}:)(?!.*\b20\d{2}-W\d{2}\b).+\Z
    - Hydra
    - (?:(?:\b(?:3|three)\b).{0,100}(?:orders?)|(?:orders?).{0,100}(?:\b(?:3|three)\b))
    - (?:(?:\b(?:4|four)\b).{0,100}(?:units?|items?)|(?:units?|items?).{0,100}(?:\b(?:4|four)\b))
    - 9[:.]30|09[:.]30|nine.thirty
    - 9[:.]45|09[:.]45|quarter.to.ten
    - 10(?::00|\s*a\.?m\.?)?\b
    state_has:
      user:role: associate
      user:user_id: A-1004
      user:store_id: S-014
    tools_any:
    - get_inventory_context
    - get_bopis_demand
notes: Run against an unchanged generated operations dataset. Assertions describe source records, not a reset
  of the live demo. Follow-ups may reuse fresh evidence without repeating a tool call.
