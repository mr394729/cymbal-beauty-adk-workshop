# Pull-request checks. Keyless: the eval job exchanges the GitHub OIDC token for the read-only
# evaluator service account through Workload Identity Federation. Fork PRs get no cloud access.
name: ci
on:
  pull_request:
    paths-ignore: ["docs/**", "quickstarts/**/README.md", "README.md", "SETUP.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "quickstarts/**/README.md", "README.md", "SETUP.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run python scripts/check_skills.py
      - run: uv run python scripts/check_docs.py
      - run: uv run pytest tests/unit tests/quickstarts -q
  eval-gate:
    # Runs the golden evalset against the agent with real model calls; needs cloud identity.
    needs: lint-test
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
      GOOGLE_CLOUD_LOCATION: global
      STORE_OPS_ENV: dev
      WORKSHOP_NAMESPACE: ${{ vars.WORKSHOP_NAMESPACE }}
      EVAL_NUM_RUNS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --locked --all-extras
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_EVALUATOR_SA }}
      - run: uv run python scripts/check_env.py --stage prereqs
      - run: uv run python eval/build_eval_set.py
      - run: uv run pytest tests/eval -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-history
          path: |
            build/eval_runs/**/metrics.csv
            build/eval_runs/**/cymbal_store_ops/.adk/eval_history/*.evalset_result.json
          include-hidden-files: true
          if-no-files-found: ignore
